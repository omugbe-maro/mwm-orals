<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
/* Layout: app shell. Top bar with brand; tab nav on the right at desktop, fixed bottom bar on phones.
   Palette: chart-paper white, ship's-ink navy, SOLAS orange accent. Radar and night scenes are fixed instrument colours. */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E3EAEE; --ink:#0F2230; --muted:#526572; --line:#C9D5DC;
  --navy:#16384D; --navy-ink:#F2F6F8; --accent:#C8460F; --accent-ink:#FFFFFF; --accent-soft:#F8E3D8;
  --ok:#11775A; --ok-soft:#DDF1EA; --bad:#B9352A; --bad-soft:#F8E1DE; --warn:#9A6A0D; --warn-soft:#F6EBD3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A131A; --surface:#101C24; --surface-2:#16252F; --ink:#DCE6EB; --muted:#8FA3AF; --line:#24363F;
    --navy:#0E2736; --navy-ink:#E6EEF2; --accent:#FF7C3F; --accent-ink:#1C0B03; --accent-soft:#3A2116;
    --ok:#4FCB9C; --ok-soft:#12302A; --bad:#FF7468; --bad-soft:#3A1A18; --warn:#E9B65A; --warn-soft:#352915; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A131A; --surface:#101C24; --surface-2:#16252F; --ink:#DCE6EB; --muted:#8FA3AF; --line:#24363F;
  --navy:#0E2736; --navy-ink:#E6EEF2; --accent:#FF7C3F; --accent-ink:#1C0B03; --accent-soft:#3A2116;
  --ok:#4FCB9C; --ok-soft:#12302A; --bad:#FF7468; --bad-soft:#3A1A18; --warn:#E9B65A; --warn-soft:#352915; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.005em;line-height:1.08;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.mono{font-family:var(--mono)}

/* shell */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:var(--navy-ink)}
.topbar .in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;text-align:left}
.brand svg{flex:none}
.brand .t1{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;font-weight:600}
.brand .t2{display:block;font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{background:none;border:0;color:var(--navy-ink);opacity:.78;padding:10px 14px;border-radius:6px;font-weight:500;display:flex;align-items:center;gap:8px}
.tabs button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12)}
.tabs button:hover{opacity:1}
.tabs svg{width:18px;height:18px}
.botnav{display:none}
@media (max-width:860px){
  .tabs{display:none}
  .botnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .botnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:12px;font-weight:500;color:var(--muted);min-height:var(--nav-h)}
  .botnav button svg{width:22px;height:22px}
  .botnav button[aria-current="page"]{color:var(--accent)}
  main{padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))!important}
}
main{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px;display:flex;flex-direction:column;gap:22px}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--ink)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.btn{border-radius:7px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.lead{font-size:18px;max-width:64ch}
.muted{color:var(--muted)}
.small{font-size:14px}
ul.points{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:72ch}
.disclaimer{font-size:13px;color:var(--muted);max-width:80ch;border-top:1px solid var(--line);padding-top:14px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:46px}
@media (max-width:560px){.hero h1{font-size:36px}}
.hero .intro{display:flex;flex-direction:column;gap:12px;justify-content:center}
.meters{display:flex;flex-direction:column;gap:14px}
.meter .lab{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.meter .lab b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.modes{grid-template-columns:minmax(0,1fr)}}
.mode{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;color:inherit}
.mode:hover{border-color:var(--accent)}
.mode .ic{width:52px;height:52px;border-radius:9px;background:var(--navy);display:grid;place-items:center}
.mode h2{font-size:26px}
.mode p{color:var(--muted);font-size:15px;margin-top:4px}
.mode .go{margin-top:10px;font-weight:600;color:var(--accent);font-size:15px}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;display:inline-flex;gap:8px;align-items:center}
.weak button b{font-family:var(--mono);font-weight:500;color:var(--bad)}

/* rules list */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;min-height:36px}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-size:22px}
.group .gsub{font-size:13px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.trow .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.trow .tt{font-weight:500}
.trow .st{display:flex;gap:6px}
@media (max-width:560px){.trow{grid-template-columns:62px minmax(0,1fr)}.trow .st{grid-column:2}}

/* topic */
.topic-head{display:flex;flex-direction:column;gap:6px}
.topic-head .num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent)}
.topic-head h1{font-size:40px}
@media (max-width:560px){.topic-head h1{font-size:32px}}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec h3{font-size:22px;margin-bottom:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);padding:0;text-align:left;display:flex;flex-direction:column}
.thumb:hover{border-color:var(--accent)}
.thumb .pic{aspect-ratio:16/9;max-width:100%;background:#04070D}
.thumb .pic svg{display:block;width:100%;height:100%}
.thumb span{font-size:13px;padding:6px 9px;font-weight:500}
.qa{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.qa:first-of-type{border-top:0;padding-top:0}
.qa .q{font-weight:500}
.qa .a{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.reveal{align-self:flex-start;background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:14px;font-weight:600}
.reveal:hover{border-color:var(--accent)}
.mcq{display:flex;flex-direction:column;gap:8px}
.mcq button.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.mcq button.opt:hover:not([disabled]){border-color:var(--accent)}
.mcq button.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.mcq button.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.mcq button.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.mcq button.opt[disabled]{cursor:default}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{font-weight:600}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* pictures */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#04070D}
.stage svg{display:block;width:100%;height:100%}
.ans{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--accent);padding-top:12px}
.ans h3{font-size:26px}
.ans .char{font-family:var(--mono);color:var(--accent)}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0}
dl.facts dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
dl.facts dd{margin:0}
.rhythm{overflow-x:auto} .rhythm svg{display:block;width:100%;min-width:300px;height:auto}
.rhythm .lbl{fill:var(--muted);font-family:var(--mono);font-size:11px} .rhythm .ax{stroke:var(--line)} .rhythm .bar-W{fill:#FFF3D1;stroke:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,18,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .box{background:var(--surface);border-radius:12px;max-width:820px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* encounters */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ecard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;color:inherit}
.ecard:hover{border-color:var(--accent)}
.ecard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ecard .id{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent)}
.ecard .tl{font-weight:600}
.scope-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
.scope-wrap.single{grid-template-columns:minmax(0,1fr)}
.scope-wrap.single .instr{max-width:480px;width:100%}
@media (max-width:900px){.scope-wrap{grid-template-columns:minmax(0,1fr)}}
.instr{background:#05100D;border-radius:10px;overflow:hidden;border:1px solid #17352B}
.instr svg{display:block;width:100%;height:auto}
.instr .cap{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:#7FD9AE;background:#03130D;flex-wrap:wrap}
.night{background:#02050A;border-color:#1B2635}
.night .cap{color:#AFC3DA;background:#060B14}
.arpa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:0;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (min-width:900px){.arpa{grid-template-columns:repeat(9,minmax(0,1fr))}}
.arpa div{background:var(--surface);padding:8px 10px;min-width:0}
.arpa dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.arpa dd{margin:0;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.step{display:flex;flex-direction:column;gap:10px}
.step h3{font-size:22px}
.vis-badge{font-family:var(--mono);font-size:12px}
.playbtn{align-self:flex-start}

/* oral */
.oral-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{flex:1 1 200px;min-width:160px}
.qcard{display:flex;flex-direction:column;gap:14px}
.qcard .qtext{font-size:21px;font-weight:600;line-height:1.35;max-width:62ch;text-wrap:balance}
.qcard .ctx{font-weight:500;color:var(--muted)}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.marks button{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:11px 8px;font-weight:600;min-height:48px}
.marks .m-got:hover{border-color:var(--ok);background:var(--ok-soft)}
.marks .m-partly:hover{border-color:var(--warn);background:var(--warn-soft)}
.marks .m-missed:hover{border-color:var(--bad);background:var(--bad-soft)}
.follow-tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tagbars{display:flex;flex-direction:column;gap:10px}
.tagbars .lab{display:flex;justify-content:space-between;font-size:14px}
.tagbars .bar i.ok{background:var(--ok)} .tagbars .bar i.warn{background:var(--warn)} .tagbars .bar i.bad{background:var(--bad)}
.hist{display:flex;flex-direction:column}
.hist .hr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hist .hr:first-child{border-top:0}
.review{display:flex;flex-direction:column;gap:8px}
.review .back{text-align:left;padding:4px 0}
.review .it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.empty{color:var(--muted);font-size:15px}
.about-btn{background:none;border:0;color:var(--navy-ink);opacity:.85;padding:10px 12px;border-radius:6px;font-weight:500;display:flex;align-items:center;gap:8px;margin-left:4px}
.about-btn svg{width:20px;height:20px}
.about-btn[aria-current="page"],.about-btn:hover{opacity:1;background:rgba(255,255,255,.12)}
@media (max-width:860px){.about-btn{margin-left:auto}.about-btn span{display:none}}
.foot{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.foot .links{display:flex;flex-wrap:wrap;gap:6px 16px}
.foot a{color:var(--muted)} .foot a:hover{color:var(--ink)}
@media (max-width:860px){.foot{padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))} main{padding-bottom:24px!important}}
.report{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px;color:var(--muted)}
.report a,.linkbtn{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:4px 0;font-size:14px}
.report a:hover,.linkbtn:hover{text-decoration:underline}

<script>
(function(){
"use strict";
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); window.__mwmInstall=e; });
const inline=document.getElementById('content').textContent.trim();
if(inline && inline[0]==='{'){ start(JSON.parse(inline)); }
else {
  document.getElementById('main').innerHTML='<p class="empty">Loading the study notes…</p>';
  fetch('content.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(start)
    .catch(()=>{ document.getElementById('main').innerHTML='<p class="empty">The study notes could not be loaded. Check your connection and reload the page.</p>'; });
}
function start(C){
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
let UID = 0; const uid = () => 'u'+(++UID);

const TOPICS = C.topics, TBY = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const PICS = C.pictures, PBY = Object.fromEntries(PICS.map(p=>[p.id,p]));
const ENC = C.encounters, EBY = Object.fromEntries(ENC.map(e=>[e.id,e]));
const VERB = C.oral.verbal, SND = C.oral.sounds, SBY = Object.fromEntries(SND.map(s=>[s.id,s])), VBY = Object.fromEntries(VERB.map(v=>[v.id,v]));
const TAGS = C.meta.tags;

/* ---------------- progress store (this device only) ---------------- */
const KEY = 'mwm-orals-v1';
let S = {studied:{}, checks:{}, enc:{}, tags:{}, oral:[]};
try { const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } } catch(e){}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); if(typeof schedulePush==='function') schedulePush(); }
function tagScore(tag, v){ const t = S.tags[tag] || (S.tags[tag] = {n:0, sum:0}); t.n++; t.sum += v; }

/* ---------------- icons ---------------- */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  rules:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 8h6M9 12h6"/></svg>',
  enc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18 6"/></svg>',
  oral:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
};
const NAV = [['home','Home'],['rules','Study'],['enc','Encounters'],['oral','Mock oral']];

/* ---------------- router ---------------- */
const CT = C.meta.contact || {};
const SITE = CT.siteUrl || (location.origin + location.pathname);
const WA = String(CT.whatsapp||'').replace(/[^0-9]/g,'');
const hashOf = v => ({home:'', rules:'study', topic:v.param, enc:'encounters', encrun:v.param, oral:'oral', oralrun:'oral', oralres:'oral', about:'about', account:'account'}[v.name] || '');
function parseHash(){
  const h=(location.hash||'').replace(/^#/,'');
  if(h==='study') return {name:'rules'};
  if(h==='encounters') return {name:'enc'};
  if(h==='oral') return {name:'oral'};
  if(h==='about') return {name:'about'};
  if(h==='account') return {name:'account'};
  if(TBY[h]) return {name:'topic',param:h};
  if(EBY[h]) return {name:'encrun',param:h};
  return {name:'home'};
}
let view = parseHash();
/* ---------------- visitor statistics (Umami: no cookies, no personal data) ---------------- */
const AN = C.meta.analytics || {};
const AN_KEY = 'mwm-no-analytics';
function anOptedOut(){ try{ return localStorage.getItem(AN_KEY)==='1'; }catch(e){ return false; } }
function anDNT(){ return navigator.doNotTrack==='1' || window.doNotTrack==='1' || navigator.msDoNotTrack==='1'; }
const AN_ON = !!(window.MWM_PWA && AN.websiteId && AN.scriptUrl);
const anQueue=[]; let anLoaded=false, anFirst=true;
function anActive(){ return AN_ON && !anOptedOut() && !anDNT() && (!AN.domains || String(AN.domains).split(',').map(x=>x.trim()).includes(location.hostname)); }
function anLoad(){
  if(anLoaded || !anActive()) return; anLoaded=true;
  const sc=document.createElement('script'); sc.defer=true; sc.src=AN.scriptUrl;
  sc.setAttribute('data-website-id', AN.websiteId); sc.setAttribute('data-auto-track','false'); sc.setAttribute('data-do-not-track','true');
  if(AN.domains) sc.setAttribute('data-domains', AN.domains);
  sc.onload=()=>{ while(anQueue.length){ const f=anQueue.shift(); try{ f(); }catch(e){} } };
  document.head.appendChild(sc);
}
function anSend(f){ if(!anActive()) return; anLoad(); if(window.umami && typeof window.umami.track==='function'){ try{ f(); }catch(e){} } else anQueue.push(f); }
const pathOf = v => ({home:'/', rules:'/study', topic:'/study/'+v.param, enc:'/encounters', encrun:'/encounters/'+v.param, oral:'/mock-oral', oralrun:'/mock-oral/session', oralres:'/mock-oral/result', about:'/about', account:'/account'}[v.name] || '/');
function titleOf(v){
  const T=' · MWM Orals';
  if(v.name==='topic'&&TBY[v.param]){ const t=TBY[v.param]; return (t.group==='ANX'||t.group==='BUOY'?t.num:'Rule '+t.num)+': '+t.title+T; }
  if(v.name==='encrun'&&EBY[v.param]) return v.param+' '+EBY[v.param].title+T;
  return ({home:'MWM Orals: COLREGs & Buoyage for the OOW oral', rules:'Study the Rules'+T, enc:'Encounter trainer'+T, oral:'Mock oral'+T, oralrun:'Mock oral'+T, oralres:'Mock oral result'+T, about:'About'+T, account:'Account'+T})[v.name] || 'MWM Orals';
}
function trackView(){
  const extra = anFirst ? location.search.replace(/([?&])(code|error|error_description|access_token)=[^&]*/g,'$1').replace(/[?&]+$/,'') : '';
  const url=pathOf(view)+extra, title=titleOf(view); anFirst=false;
  anSend(()=>window.umami.track(props=>Object.assign({},props,{url,title})));
}
function trackEvent(name,data){ anSend(()=>window.umami.track(name, data||{})); }
function evAttr(name,data){ return `data-ev="${esc(name)}" data-ev-data="${esc(JSON.stringify(data||{}))}"`; }
document.addEventListener('click',e=>{ const a=e.target.closest('[data-ev]'); if(a){ let d={}; try{ d=JSON.parse(a.dataset.evData||'{}'); }catch(_){} trackEvent(a.dataset.ev,d); } });
function go(name, param){
  view = {name, param};
  const h = hashOf(view), cur = (location.hash||'').replace(/^#/,'');
  if(h!==cur){ try{ history.pushState(null,'',h?'#'+h:location.pathname+location.search); }catch(e){} }
  render(); window.scrollTo(0,0); trackView();
}
window.addEventListener('popstate',()=>{ const v=parseHash(); view = (session && v.name==='oral') ? {name:'oralrun'} : v; render(); trackView(); });
function navKey(){ return {home:'home', rules:'rules', topic:'rules', enc:'enc', encrun:'enc', oral:'oral', oralrun:'oral', oralres:'oral', about:'about', account:'account'}[view.name] || 'home'; }
function renderNav(){
  const k = navKey();
  const b = NAV.map(([id,l]) => `<button type="button" data-nav="${id}" ${k===id?'aria-current="page"':''}>${ICON[id]}<span>${l}</span></button>`).join('');
  $('tabs').innerHTML = b; $('botnav').innerHTML = b;
  if(k==='about') $('about-btn').setAttribute('aria-current','page'); else $('about-btn').removeAttribute('aria-current');
  if(typeof renderAcctBtn==='function') renderAcctBtn();
}
/* contact helpers */
function mailHref(subject, body){ return CT.email ? `mailto:${CT.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}` : ''; }
function waHref(text){ return WA ? `https://wa.me/${WA}?text=${encodeURIComponent(text)}` : ''; }
function reportHTML(id, label){
  const m = mailHref(`MWM Orals: possible mistake in ${id}`, `Item: ${id} (${label})\n\nWhat looks wrong:\n\nWhat it should say (rule reference if you have one):\n`);
  const w = waHref(`MWM Orals: possible mistake in ${id} (${label}). `);
  if(!m && !w) return '';
  return `<div class="report"><span>Spotted a mistake in ${esc(id)}?</span>${w?`<a href="${w}" target="_blank" rel="noopener" ${evAttr('report-mistake',{item:id,channel:'whatsapp'})}>Tell us on WhatsApp</a>`:''}${m?`<a href="${m}" ${evAttr('report-mistake',{item:id,channel:'email'})}>Email us</a>`:''}</div>`;
}
function coachHTML(place){
  const w = waHref('Hello Maro, I would like to book a live mock OOW oral.');
  const m = mailHref('Booking a live mock OOW oral', 'Hello Maro,\n\nI would like to book a live mock OOW oral. My exam date is:\n');
  if(!w && !m) return '';
  return `<section class="cta"><div><h3>Want a live mock oral?</h3><p>Sit a one-to-one mock OOW oral online with a Master Mariner, with feedback on every answer.</p></div><a class="btn" href="${w||m}" ${w?'target="_blank" rel="noopener"':''} ${evAttr('coaching-click',{channel:w?'whatsapp':'email',place:place||'other'})}>${w?'Book on WhatsApp':'Book by email'}</a></section>`;
}
function copyLink(btn, url){
  const done=()=>{ btn.textContent='Link copied'; setTimeout(()=>{ if(btn.isConnected) btn.textContent=btn.dataset.label; },2000); };
  trackEvent('copy-link',{item:(url.split('#')[1]||'home')});
  try{ navigator.clipboard.writeText(url).then(done).catch(()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ const i=document.createElement('input'); i.className='urlbox'; i.value=url; i.readOnly=true; btn.replaceWith(i); i.focus(); i.select(); }
}
function shareRow(id, label){
  return `<div class="row"><button class="linkbtn" type="button" data-copy="${esc(SITE+'#'+id)}" data-label="Copy link to ${esc(label)}">Copy link to ${esc(label)}</button></div>`;
}
document.addEventListener('click', e => { const b=e.target.closest('[data-copy]'); if(b){ copyLink(b, b.dataset.copy); } });
function renderFoot(){
  $('foot').innerHTML = `<div class="links"><span>© 2026 Maritime With Maro</span><a href="#about" data-nav="about">About</a><a href="${esc(SITE)}privacy.html" target="_blank" rel="noopener">Privacy</a><a href="${esc(SITE)}terms.html" target="_blank" rel="noopener">Terms of use</a>${CT.youtube?`<a href="${esc(CT.youtube)}" target="_blank" rel="noopener">YouTube</a>`:''}</div><p>Study aid only. Not affiliated with the MCA or IMO.</p>`;
}
document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if(n){ e.preventDefault(); go(n.dataset.nav); return; }
});
$('brand').onclick = () => go('home');

function render(){
  try{ document.title=titleOf(view); }catch(e){}
  renderNav();
  const m = $('main');
  stopLamps();
  if(view.name==='oralrun' && !session) view={name:'oral'};
  if(view.name==='oralres' && !view.param) view={name:'oral'};
  ({home:vHome, rules:vRules, topic:vTopic, enc:vEnc, encrun:vEncRun, oral:vOral, oralrun:vOralRun, oralres:vOralRes, about:vAbout, account:vAccount}[view.name] || vHome)(m);
  startLamps();
}

/* ================= PICTURES (buoys, lights, shapes) ================= */
const PS = C.pictureStyle, PAINT = PS.paint, LIGHT = PS.light, SEQ = PS.rhythms;
const BODY={
  pillar:{paths:['M244,276 L396,276 Q392,300 320,302 Q248,300 244,276 Z','M276,280 L364,280 L346,128 L294,128 Z'],x0:244,x1:396,y0:128,y1:302,top:110,yb:92,band:[190,240]},
  can:{paths:['M268,176 L372,176 L372,288 Q320,300 268,288 Z'],x0:268,x1:372,y0:166,y1:300,top:166,yb:136,band:[208,244]},
  cone:{paths:['M320,150 L380,286 Q320,300 260,286 Z'],x0:260,x1:380,y0:150,y1:300,top:150,yb:126,band:[214,250]}
};
const TOPH={can:34,coneUp:34,N:58,S:58,E:56,W:56,'2sph':54,sph:34,X:44,cross:52};
const STK='stroke="rgba(18,22,28,.6)" stroke-width="1.5"';
function topmark(t,c,yb){
  const p=PAINT[c]; const tri=(a,apex)=>`<path d="M300,${a} L340,${a} L320,${apex} Z" fill="${p}" ${STK}/>`;
  switch(t){
    case 'can': return `<rect x="303" y="${yb-34}" width="34" height="34" rx="2" fill="${p}" ${STK}/>`;
    case 'coneUp': return tri(yb,yb-34);
    case 'N': return tri(yb,yb-26)+tri(yb-32,yb-58);
    case 'S': return tri(yb-26,yb)+tri(yb-58,yb-32);
    case 'E': return tri(yb-30,yb-56)+tri(yb-28,yb-2);
    case 'W': return tri(yb-56,yb-30)+tri(yb-2,yb-28);
    case '2sph': return `<circle cx="320" cy="${yb-13}" r="12" fill="${p}" ${STK}/><circle cx="320" cy="${yb-41}" r="12" fill="${p}" ${STK}/>`;
    case 'sph': return `<circle cx="320" cy="${yb-17}" r="16" fill="${p}" ${STK}/>`;
    case 'X': { const y=yb-24; return `<g stroke-linecap="square"><path d="M305,${y-15} L335,${y+15} M335,${y-15} L305,${y+15}" stroke="rgba(18,22,28,.7)" stroke-width="10"/><path d="M305,${y-15} L335,${y+15} M335,${y-15} L305,${y+15}" stroke="${p}" stroke-width="7"/></g>`; }
    case 'cross': { const y=yb-26; return `<g stroke-linecap="square"><path d="M320,${y-24} L320,${y+24} M298,${y} L342,${y}" stroke="rgba(18,22,28,.7)" stroke-width="10"/><path d="M320,${y-24} L320,${y+24} M298,${y} L342,${y}" stroke="${p}" stroke-width="7"/></g>`; }
  } return '';
}
function seaWaves(){ return [300,318,338].map((y,i)=>`<path d="M${40+i*30},${y} q24,-6 48,0 t48,0 M${380-i*20},${y+6} q24,-6 48,0 t48,0" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-linecap="round"/>`).join(''); }
function buoySVG(b,u){
  const B=BODY[b.body], w=B.x1-B.x0, h=B.y1-B.y0; let fill='';
  if(b.fill.t==='solid') fill=`<rect x="${B.x0}" y="${B.y0-12}" width="${w}" height="${h+14}" fill="${PAINT[b.fill.c]}"/>`;
  else if(b.fill.t==='band') fill=`<rect x="${B.x0}" y="${B.y0-12}" width="${w}" height="${h+14}" fill="${PAINT[b.fill.c]}"/><rect x="${B.x0}" y="${B.band[0]}" width="${w}" height="${B.band[1]-B.band[0]}" fill="${PAINT[b.fill.b]}"/>`;
  else if(b.fill.t==='h'){ const n=b.fill.c.length, bh=h/n; fill=b.fill.c.map((c,i)=>`<rect x="${B.x0}" y="${(B.y0+i*bh-(i===0?12:0)).toFixed(1)}" width="${w}" height="${(bh+(i===0?12:0)+0.6).toFixed(1)}" fill="${PAINT[c]}"/>`).join(''); }
  else if(b.fill.t==='v'){ const n=b.fill.n, sw=w/n; fill=Array.from({length:n},(_,i)=>`<rect x="${(B.x0+i*sw).toFixed(1)}" y="${B.y0-12}" width="${(sw+0.6).toFixed(1)}" height="${h+14}" fill="${PAINT[b.fill.c[i%2]]}"/>`).join(''); }
  const clip=B.paths.map(d=>`<path d="${d}"/>`).join(''), outline=B.paths.map(d=>`<path d="${d}" fill="none" ${STK}/>`).join('');
  const canTop=b.body==='can'?`<ellipse cx="320" cy="176" rx="52" ry="10" fill="${PAINT[b.fill.c]}" ${STK}/><ellipse cx="320" cy="176" rx="52" ry="10" fill="url(#shade-${u})"/>`:'';
  const lantern=b.body==='pillar'?`<rect x="308" y="110" width="24" height="18" rx="2" fill="#2E3338"/><rect x="312" y="113" width="16" height="8" rx="1" fill="#A9C0CE" opacity=".85"/>`:'';
  const poleTop=B.yb-(TOPH[b.top]||30);
  return `<svg viewBox="0 0 640 360" role="img" aria-label="A buoy by daylight"><defs>
<linearGradient id="sky-${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9D2E3"/><stop offset="1" stop-color="#E8F0F4"/></linearGradient>
<linearGradient id="sea-${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B93AE"/><stop offset="1" stop-color="#1D4860"/></linearGradient>
<linearGradient id="shade-${u}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>

  const X0=10,X1=630,sc=(X1-X0)/win; let bars='';
  seqs.forEach(({c,seq})=>{ let t=0; while(t<win){ for(const [ms,on] of seq){ if(on&&t<win){ const w=Math.min(ms,win-t)*sc; bars+=`<rect x="${(X0+t*sc).toFixed(1)}" y="14" width="${Math.max(w,1.5).toFixed(1)}" height="22" rx="1.5" ${c==='W'?'class="bar-W"':`fill="${LIGHT[c].core}" stroke="rgba(0,0,0,.25)"`}/>`;} t+=ms; } } });

let rafId=null;
function lampTick(now){
  document.querySelectorAll('svg[data-t0]').forEach(svg=>{
    const t=now-Number(svg.dataset.t0);
    svg.querySelectorAll('.lamp[data-seq]').forEach(el=>{ const seq=SEQ[el.dataset.seq]; if(!seq) return; const per=seq.reduce((a,s)=>a+s[0],0); let m=t%per,on=0; for(const [ms,o] of seq){ if(m<ms){on=o;break;} m-=ms; } el.style.opacity=on?1:0; });
  });
  rafId=requestAnimationFrame(lampTick);
}
function startLamps(){ if(!rafId) rafId=requestAnimationFrame(lampTick); }
function stopLamps(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }

/* ================= SOUND ================= */
let actx=null, playing=false;
function playPattern(pattern, gapMs, btn){
  if(playing) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  if(actx.state==='suspended') actx.resume();
  const sm=C.meta.sound, gap=(gapMs||sm.gapMs)/1000; let t=actx.currentTime+0.15;
  const master=actx.createGain(); master.gain.value=0.22; master.connect(actx.destination);
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100; lp.connect(master);
  [...pattern].forEach((ch,i)=>{
    const d=(ch==='P'?sm.prolongedMs:sm.shortMs)/1000;
    [[138,'sawtooth',.55],[207,'sawtooth',.35],[276,'triangle',.25]].forEach(([f,type,amp])=>{
      const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(amp,t+0.06); g.gain.setValueAtTime(amp,t+d-0.08); g.gain.linearRampToValueAtTime(0,t+d);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t+d+0.05);
    });
    t+=d+gap;
  });
  playing=true; if(btn){ btn.disabled=true; btn.textContent='Playing…'; }
  setTimeout(()=>{ playing=false; if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent='Play again'; } }, (t-actx.currentTime)*1000);
}
function patternText(p){ return [...p].map(c=>c==='P'?'prolonged':'short').join(', '); }

const rad=d=>d*Math.PI/180, uv=d=>[Math.sin(rad(d)),Math.cos(rad(d))];

  const vo=uv(e.own.course).map(c=>c*e.own.speed), vt=uv(e.target.course).map(c=>c*e.target.speed);

}

  <rect width="400" height="400" fill="#05100D"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#scope)" stroke="#2C6B53" stroke-width="1.5"/>`;
  for(let r=rings;r<scale-1e-6;r+=rings) s+=`<circle cx="${cx}" cy="${cy}" r="${(r*k).toFixed(1)}" fill="none" stroke="rgba(90,220,160,.22)"/>`;
  for(let b=0;b<360;b+=10){ const [x,y]=uv(b), l=b%30===0?10:5; s+=`<line x1="${cx+x*(R-l)}" y1="${cy-y*(R-l)}" x2="${cx+x*R}" y2="${cy-y*R}" stroke="rgba(110,230,170,.5)"/>`; }
  [['000',0],['090',90],['180',180],['270',270]].forEach(([t,b])=>{ const [x,y]=uv(b); s+=`<text x="${cx+x*(R+12)}" y="${cy-y*(R+12)+4}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="#7FD9AE">${t}</text>`; });
  const [hx,hy]=uv(e.own.course);
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx+hx*R}" y2="${cy-hy*R}" stroke="#BFF5DA" stroke-width="1.4"/>`;
  const ov=uv(e.own.course).map(c=>c*e.own.speed*0.1*k);
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx+ov[0]}" y2="${cy-ov[1]}" stroke="#E8F7A0" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${cy}" r="3" fill="#BFF5DA"/>`;
  if(e.target){
    const {vt,vr,p}=encVectors(e);
    for(let m=6;m>=1;m--){ const q=[p[0]-vr[0]*m/60,p[1]-vr[1]*m/60]; s+=`<circle cx="${(cx+q[0]*k).toFixed(1)}" cy="${(cy-q[1]*k).toFixed(1)}" r="${(3.2-m*0.3).toFixed(1)}" fill="#59F0A6" opacity="${(0.75-m*0.1).toFixed(2)}"/>`; }
    const ex=cx+p[0]*k, ey=cy-p[1]*k;
    s+=`<ellipse cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" rx="5.5" ry="4" fill="#8DFFC6" transform="rotate(${e.target.bearing} ${ex.toFixed(1)} ${ey.toFixed(1)})"/>`;
    s+=`<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="10" fill="none" stroke="#E8F7A0" stroke-width="1.4"/>`;
    const tv=[vt[0]*0.1*k, vt[1]*0.1*k];
    s+=`<line x1="${ex.toFixed(1)}" y1="${ey.toFixed(1)}" x2="${(ex+tv[0]).toFixed(1)}" y2="${(ey-tv[1]).toFixed(1)}" stroke="#E8F7A0" stroke-width="2"/>`;
    s+=`<text x="${(ex+13).toFixed(1)}" y="${(ey-11).toFixed(1)}" font-family="IBM Plex Mono,monospace" font-size="11" fill="#E8F7A0">1</text>`;
  }
  s+=`<text x="10" y="18" font-family="IBM Plex Mono,monospace" font-size="11" fill="#7FD9AE">N UP  RM  ${scale} NM</text><text x="10" y="34" font-family="IBM Plex Mono,monospace" font-size="11" fill="#7FD9AE">RINGS ${rings} NM</text><text x="390" y="18" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="#7FD9AE">VECT 6 MIN TRUE</text><text x="390" y="34" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="#7FD9AE">TRAILS REL</text></svg>`;
  return {svg:s, scale, rings};
}
/* lights from aspect: geometry in metres along (s, fwd +) and across (t, starboard +), height h */
const VDEF={
  power50:{L:200,lights:[{s:60,t:0,h:24,c:'W',arc:'mast'},{s:-40,t:0,h:34,c:'W',arc:'mast'},{s:-42,t:16,h:20,c:'G',arc:'stbd'},{s:-42,t:-16,h:20,c:'R',arc:'port'},{s:-100,t:0,h:10,c:'W',arc:'stern'}]},
  small:{L:15,lights:[{s:2,t:0,h:6,c:'W',arc:'mast'},{s:0,t:2,h:3.5,c:'G',arc:'stbd'},{s:0,t:-2,h:3.5,c:'R',arc:'port'},{s:-7.5,t:0,h:2,c:'W',arc:'stern'}]},
  sailing:{L:14,lights:[{s:0,t:0,h:16,c:'R',arc:'all'},{s:0,t:0,h:14.6,c:'G',arc:'all'},{s:6,t:1.5,h:1.4,c:'G',arc:'stbd'},{s:6,t:-1.5,h:1.4,c:'R',arc:'port'},{s:-7,t:0,h:1.2,c:'W',arc:'stern'}]},
  nuc:{L:150,lights:[{s:-30,t:0,h:30,c:'R',arc:'all'},{s:-30,t:0,h:26,c:'R',arc:'all'},{s:-45,t:12,h:17,c:'G',arc:'stbd'},{s:-45,t:-12,h:17,c:'R',arc:'port'},{s:-75,t:0,h:9,c:'W',arc:'stern'}]},
  trawler:{L:30,lights:[{s:5,t:0,h:10,c:'G',arc:'all'},{s:5,t:0,h:8.4,c:'W',arc:'all'},{s:2,t:4,h:5,c:'G',arc:'stbd'},{s:2,t:-4,h:5,c:'R',arc:'port'},{s:-15,t:0,h:3,c:'W',arc:'stern'}]}
};
function arcVisible(arc,b){ // b = own ship's bearing from target, relative to target's heading
  const eps=2.5;
  if(arc==='all') return true;
  if(arc==='mast') return b<=112.5||b>=247.5;
  if(arc==='stbd') return b<=112.5||b>=360-eps;
  if(arc==='port') return b>=247.5||b<=eps;
  if(arc==='stern') return b>112.5&&b<247.5;
  return false;
}
function visualSVG(e){
  const def=VDEF[e.target.type]; if(!def) return '';
  const u=uid(), beta=e.arpa.aspect, d=rad(180-beta);
  const hmax=Math.max(...def.lights.map(l=>l.h)), kh=300/def.L, kv=150/hmax, hz=262;
  const lamps=def.lights.filter(l=>arcVisible(l.arc,beta)).map(l=>({x:320+(l.s*Math.sin(d)+l.t*Math.cos(d))*kh, y:hz-l.h*kv-6, c:l.c}));
  return `<svg viewBox="0 0 640 360" role="img" aria-label="Night view of the other vessel's lights">${nightBg(u,hz)}${lamps.map(L=>lampSVG(L,false,u,6.5)).join('')}</svg>`;
}

  if(USER){ const n=displayName(); b.innerHTML=`<span class="av">${esc((n[0]||'?').toUpperCase())}</span><span class="nm">${esc(n.split(' ')[0])}</span>`; b.setAttribute('aria-label','Your account'); }
  else { b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="nm">Sign in</span>`; b.setAttribute('aria-label','Sign in or create an account'); }
  if(view.name==='account') b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
}
if(AUTH_ON){
  try{
    sb=window.supabase.createClient(AC.supabaseUrl, AC.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'mwm-orals-auth'}});
    const qs=new URLSearchParams(location.search), hs=new URLSearchParams((location.hash||'').replace(/^#/,''));
    const err=qs.get('error_description')||hs.get('error_description');
    if(err){ AUTH_NOTE=err.replace(/\+/g,' '); view={name:'account'}; cleanAuthUrl(); }
    sb.auth.onAuthStateChange((event, session)=>{
      setTimeout(()=>{
        if(event==='PASSWORD_RECOVERY'){ RECOVERY=true; if(session&&session.user) USER=session.user; view={name:'account'}; cleanAuthUrl(); render(); return; }
        if(session&&session.user&&(!USER||USER.id!==session.user.id)){ onSignedIn(session.user); return; }
        if(!session&&USER){ USER=null; PROFILE=null; PLAN='free'; SYNC.state='off'; render(); return; }
        if(session&&session.user) USER=session.user;
      },0);
    });
  }catch(e){ sb=null; }
}
const GLOGO='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function msgHTML(kind,text){ return `<div class="msg ${kind}" role="${kind==='bad'?'alert':'status'}">${esc(text)}</div>`; }
function pwField(id,label,auto,hint){ return `<div class="field"><label for="${id}">${label}</label><div class="pw"><input id="${id}" type="password" autocomplete="${auto}" required minlength="8"><button type="button" data-showpw="${id}">Show</button></div>${hint?`<span class="hint">${hint}</span>`:''}</div>`; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-showpw]'); if(b){ const i=$(b.dataset.showpw); const show=i.type==='password'; i.type=show?'text':'password'; b.textContent=show?'Hide':'Show'; } });
function busy(form,on,label){ const b=form.querySelector('button[type="submit"]'); if(!b) return; if(on){ b.dataset.l=b.textContent; b.textContent=label||'Please wait…'; b.disabled=true; } else { b.textContent=b.dataset.l||b.textContent; b.disabled=false; } }
function vAccount(m){
  if(!AUTH_ON){ m.innerHTML=`<div class="auth"><h1 style="font-size:36px">Accounts</h1><p class="lead muted">Accounts are not switched on here yet. Everything works without one, and your progress is saved on this device.</p></div>`; return; }
  const ac=AC.google!==false, ae=AC.email!==false;
  if(RECOVERY){
    m.innerHTML=`<div class="auth"><span class="eyebrow">Account</span><h1 style="font-size:36px">Set a new password</h1>
      <form class="panel stack" id="f-new" novalidate>${pwField('np','New password','new-password','At least 8 characters.')}<div id="acct-msg"></div><button class="btn primary" type="submit">Save new password</button></form></div>`;
    $('f-new').onsubmit=async ev=>{ ev.preventDefault(); const f=ev.target, pw=$('np').value;
      if(pw.length<8){ $('acct-msg').innerHTML=msgHTML('bad','Choose a password of at least 8 characters.'); return; }
      busy(f,true); const {error}=await sb.auth.updateUser({password:pw}); busy(f,false);
      if(error){ $('acct-msg').innerHTML=msgHTML('bad',authErr(error)); return; }
      RECOVERY=false; AUTH_NOTE='Your password has been changed.'; vAccount(m); };
    return;
  }
  if(USER){
    const prov=(USER.app_metadata&&USER.app_metadata.provider)==='google'?'Google':'email and password';
    m.innerHTML=`<div class="auth"><span class="eyebrow">Your account</span><h1 style="font-size:36px">${esc(displayName())}</h1>
      ${AUTH_NOTE?msgHTML('ok',AUTH_NOTE):''}
      <section class="panel stack"><dl class="kv"><dt>Email</dt><dd>${esc(USER.email||'')}</dd><dt>Signed in with</dt><dd>${prov}</dd><dt>Plan</dt><dd>${isPremium()?'Premium':'Free'}</dd></dl>
        <p class="small" id="sync-status" aria-live="polite">${esc(syncText())}</p>
        <div class="row"><button class="btn" type="button" id="sync-now">Sync now</button><button class="btn" type="button" id="sign-out">Sign out</button></div></section>
      <form class="panel stack" id="f-prof"><h3 style="font-size:22px">Your details</h3>
        <div class="field"><label for="pn">Name</label><input id="pn" type="text" maxlength="80" autocomplete="name" value="${esc((PROFILE&&PROFILE.display_name)||'')}"></div>
        <div class="field"><label for="pr">I am</label><select id="pr"><option value="">Prefer not to say</option>${ROLES.map(([k,l])=>`<option value="${k}" ${PROFILE&&PROFILE.role===k?'selected':''}>${l}</option>`).join('')}</select></div>
        <div id="prof-msg"></div><button class="btn" type="submit">Save details</button></form>
      <section class="panel stack"><h3 style="font-size:22px">Delete your account</h3>
        <p class="small">Deletes your account, your details and the progress synced to it. Progress saved in this browser stays until you reset it on the About page.</p>
        <div class="row"><button class="btn danger" type="button" id="del">Delete my account</button></div><div id="del-msg"></div></section></div>`;
    AUTH_NOTE='';
    $('sync-now').onclick=()=>pushNow();
    $('sign-out').onclick=async()=>{ await sb.auth.signOut(); acctTab='signin'; USER=null; PROFILE=null; PLAN='free'; SYNC.state='off'; AUTH_NOTE='You are signed out. Your progress is still saved on this device.'; render(); };
    $('f-prof').onsubmit=async ev=>{ ev.preventDefault(); const f=ev.target; busy(f,true,'Saving…');
      const upd={display_name:$('pn').value.trim().slice(0,80)||null, role:$('pr').value||null};
      const {error}=await sb.from('profiles').update(upd).eq('id',USER.id); busy(f,false);
      if(error){ $('prof-msg').innerHTML=msgHTML('bad',authErr(error)); return; }
      PROFILE=Object.assign(PROFILE||{},upd); renderAcctBtn(); $('prof-msg').innerHTML=msgHTML('ok','Saved.'); };
    $('del').onclick=async()=>{
      if(!delArmed){ delArmed=true; $('del').textContent='Yes, delete it permanently'; $('del').classList.add('danger-fill'); $('del-msg').innerHTML=msgHTML('bad','This cannot be undone. Tap again to confirm.'); return; }
      delArmed=false; $('del').disabled=true; $('del').textContent='Deleting…';
      const {error}=await sb.rpc('delete_my_account');
      if(error){ $('del').disabled=false; $('del').textContent='Delete my account'; $('del').classList.remove('danger-fill'); $('del-msg').innerHTML=msgHTML('bad',authErr(error)); return; }
      try{ await sb.auth.signOut(); }catch(e){}
      USER=null; PROFILE=null; PLAN='free'; SYNC.state='off'; AUTH_NOTE='Your account and the progress synced to it have been deleted.'; render(); };
    return;
  }
  const tabs=`<div class="authtabs" role="tablist"><button type="button" role="tab" data-atab="signin" aria-selected="${acctTab==='signin'}">Sign in</button><button type="button" role="tab" data-atab="signup" aria-selected="${acctTab==='signup'}">Create account</button></div>`;
  const google=ac?`<button class="gbtn" type="button" id="g-btn">${GLOGO}<span>${acctTab==='signup'?'Sign up with Google':'Sign in with Google'}</span></button>${acctTab==='signup'?`<p class="small muted" style="margin-top:-6px">By continuing with Google you agree to the <a href="${esc(SITE)}terms.html" target="_blank" rel="noopener" style="color:var(--accent)">terms of use</a> and <a href="${esc(SITE)}privacy.html" target="_blank" rel="noopener" style="color:var(--accent)">privacy policy</a>.</p>`:''}${ae?'<div class="or">or with email</div>':''}`:'';
  let form='';
  if(acctTab==='reset') form=`<form class="stack" id="f-reset" novalidate style="gap:14px"><p class="small">Enter your email and we will send a link to set a new password.</p>
      <div class="field"><label for="re">Email</label><input id="re" type="email" autocomplete="email" required></div><div id="acct-msg"></div>
      <button class="btn primary" type="submit">Send reset link</button><button class="linkbtn" type="button" data-atab="signin">Back to sign in</button></form>`;
  else if(acctTab==='signup') form=ae?`<form class="stack" id="f-up" novalidate style="gap:14px">
      <div class="field"><label for="un">Name</label><input id="un" type="text" maxlength="80" autocomplete="name"></div>
      <div class="field"><label for="ue">Email</label><input id="ue" type="email" autocomplete="email" required></div>
      ${pwField('up','Password','new-password','At least 8 characters.')}
      <div class="field"><label for="ur">I am (optional)</label><select id="ur"><option value="">Prefer not to say</option>${ROLES.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <label class="check"><input type="checkbox" id="ut"><span>I agree to the <a href="${esc(SITE)}terms.html" target="_blank" rel="noopener" style="color:var(--accent)">terms of use</a> and the <a href="${esc(SITE)}privacy.html" target="_blank" rel="noopener" style="color:var(--accent)">privacy policy</a>.</span></label>
      <div id="acct-msg"></div><button class="btn primary" type="submit">Create account</button></form>`:'';
  else form=ae?`<form class="stack" id="f-in" novalidate style="gap:14px">
      <div class="field"><label for="ie">Email</label><input id="ie" type="email" autocomplete="email" required></div>
      ${pwField('ip','Password','current-password')}
      <div id="acct-msg"></div><button class="btn primary" type="submit">Sign in</button><button class="linkbtn" type="button" data-atab="reset">Forgot your password?</button></form>`:'';
  m.innerHTML=`<div class="auth"><span class="eyebrow">Account</span><h1 style="font-size:36px">${acctTab==='signup'?'Create a free account':acctTab==='reset'?'Reset your password':'Sign in'}</h1>
    <p class="muted">An account is optional. It saves your progress so it follows you to another phone or laptop.</p>
    ${AUTH_NOTE?msgHTML(/deleted|signed out|changed/i.test(AUTH_NOTE)?'ok':'bad',AUTH_NOTE):''}
    ${acctTab==='reset'?'':tabs}<div class="panel stack" style="gap:14px">${acctTab==='reset'?'':google}${form}</div></div>`;
  AUTH_NOTE='';
  m.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{ acctTab=b.dataset.atab; vAccount(m); });
  const g=$('g-btn'); if(g) g.onclick=async()=>{
    afterAuthFlag(true); g.disabled=true; trackEvent('google-sign-in-click',{tab:acctTab});
    const {error}=await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo:SITE}});
    if(error){ g.disabled=false; const box=m.querySelector('.panel'); box.insertAdjacentHTML('afterbegin',msgHTML('bad',authErr(error))); } };
  const fin=$('f-in'); if(fin) fin.onsubmit=async ev=>{ ev.preventDefault(); const email=$('ie').value.trim(), pw=$('ip').value;
    if(!email||!pw){ $('acct-msg').innerHTML=msgHTML('bad','Enter your email and password.'); return; }
    busy(fin,true,'Signing in…'); const {error}=await sb.auth.signInWithPassword({email,password:pw}); busy(fin,false);
    if(error) $('acct-msg').innerHTML=msgHTML('bad',authErr(error)); else afterAuthFlag(true); };
  const fup=$('f-up'); if(fup) fup.onsubmit=async ev=>{ ev.preventDefault();
    const name=$('un').value.trim(), email=$('ue').value.trim(), pw=$('up').value, role=$('ur').value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $('acct-msg').innerHTML=msgHTML('bad','Enter a valid email address.'); return; }
    if(pw.length<8){ $('acct-msg').innerHTML=msgHTML('bad','Choose a password of at least 8 characters.'); return; }
    if(!$('ut').checked){ $('acct-msg').innerHTML=msgHTML('bad','Please tick the box to accept the terms of use and privacy policy.'); return; }
    busy(fup,true,'Creating account…');
    const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:SITE,data:{display_name:name,role}}});
    busy(fup,false);
    if(error){ $('acct-msg').innerHTML=msgHTML('bad',authErr(error)); return; }
    if(data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){ $('acct-msg').innerHTML=msgHTML('bad','An account with this email already exists. Sign in, or reset your password.'); return; }
    trackEvent('sign-up',{method:'email'});
    if(data&&data.session){ afterAuthFlag(true); return; }
    $('acct-msg').innerHTML=msgHTML('ok',`Almost done. We sent a confirmation link to ${email}. Open it to finish creating your account. Check your spam folder if it does not arrive in a few minutes.`);
    fup.querySelector('button[type="submit"]').disabled=true; };
  const frs=$('f-reset'); if(frs) frs.onsubmit=async ev=>{ ev.preventDefault(); const email=$('re').value.trim();
    if(!email){ $('acct-msg').innerHTML=msgHTML('bad','Enter your email address.'); return; }
    busy(frs,true,'Sending…'); const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE}); busy(frs,false);
    $('acct-msg').innerHTML=error?msgHTML('bad',authErr(error)):msgHTML('ok','If an account exists for that email, a reset link is on its way.'); };
}
window.MWM_RENDER={picSVG,radarSVG,visualSVG,PBY,EBY};
renderFoot();
render();
trackView();
}
})();
